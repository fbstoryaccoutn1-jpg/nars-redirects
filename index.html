<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Link Cloaker</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
    }
    .container { padding: 40px; }
    h1 { font-size: 3em; margin-bottom: 20px; }
    p { font-size: 1.2em; opacity: 0.9; margin-bottom: 40px; }
    .btn {
      display: inline-block;
      padding: 15px 40px;
      background: white;
      color: #667eea;
      text-decoration: none;
      border-radius: 30px;
      font-weight: 600;
      font-size: 1.1em;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .features {
      margin-top: 60px;
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
    }
    .feature {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 10px;
      backdrop-filter: blur(10px);
    }
    .feature h3 { margin: 0 0 10px 0; }
    .feature p { margin: 0; font-size: 0.9em; opacity: 0.8; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔗 Smart Link Cloaker</h1>
    <p>Create links that show custom previews on Twitter/X<br>but redirect users to your real destination</p>
    <a href="/admin" class="btn">Create New Link</a>
    
    <div class="features">
      <div class="feature">
        <h3>🤖 Bot Detection</h3>
        <p>Shows 200 + HTML to crawlers</p>
      </div>
      <div class="feature">
        <h3>🔀 302 Redirect</h3>
        <p>Real users redirected instantly</p>
      </div>
      <div class="feature">
        <h3>📱 Custom Previews</h3>
        <p>Control Twitter card images</p>
      </div>
    </div>
  </div>
</body>
</html>
