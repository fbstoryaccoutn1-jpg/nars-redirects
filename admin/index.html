<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nars Link Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0f1117;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 40px 20px;
    }

    .container {
      width: min(700px, 100%);
      margin: auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .sub {
      color: #999;
      margin-bottom: 30px;
    }

    .card {
      background: #191c24;
      border: 1px solid #2b2f3a;
      border-radius: 16px;
      padding: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      border: 1px solid #3a3f4b;
      background: #101219;
      color: #fff;
      outline: none;
      margin-bottom: 18px;
    }

    input:focus {
      border-color: #777;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #fff;
      color: #111;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result {
      display: none;
      margin-top: 25px;
      padding: 18px;
      background: #101219;
      border-radius: 10px;
    }

    .result input {
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .copy {
      background: #2b2f3a;
      color: #fff;
    }

    .message {
      margin-top: 15px;
      color: #aaa;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Nars Link Generator</h1>

  <div class="sub">
    Add an image URL and generate a unique preview link.
  </div>

  <div class="card">

    <label for="imageUrl">Image URL</label>

    <input
      id="imageUrl"
      type="url"
      placeholder="https://example.com/image.jpg"
      autocomplete="off"
    >

    <button id="generate">
      Generate Link
    </button>

    <div id="result" class="result">

      <label>Generated Link</label>

      <input
        id="generatedLink"
        type="text"
        readonly
      >

      <button id="copy" class="copy">
        Copy Link
      </button>

    </div>

    <div id="message" class="message"></div>

  </div>

</div>

<script>
  const imageUrl =
    document.getElementById("imageUrl");

  const generate =
    document.getElementById("generate");

  const result =
    document.getElementById("result");

  const generatedLink =
    document.getElementById("generatedLink");

  const copy =
    document.getElementById("copy");

  const message =
    document.getElementById("message");


  generate.addEventListener("click", async () => {

    const image = imageUrl.value.trim();

    if (!image) {
      message.textContent =
        "Please enter an image URL.";
      return;
    }

    try {
      new URL(image);
    } catch {
      message.textContent =
        "Invalid image URL.";
      return;
    }

    generate.disabled = true;

    message.textContent =
      "Generating...";

    try {

      const response = await fetch(
        "/api/create",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            image_url: image
          })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.error ||
          "Failed to generate link."
        );
      }

      generatedLink.value = data.url;

      result.style.display = "block";

      message.textContent =
        "Link generated successfully.";

    } catch (error) {

      message.textContent =
        error.message;

    } finally {

      generate.disabled = false;
    }

  });


  copy.addEventListener("click", async () => {

    await navigator.clipboard.writeText(
      generatedLink.value
    );

    copy.textContent = "Copied!";

    setTimeout(() => {
      copy.textContent = "Copy Link";
    }, 1500);

  });
</script>

</body>
</html>
